# CodeRabbit Configuration for CoC7-QoL
# This configures automated code reviews for pull requests
# Using CodeRabbit Schema v2

# Enable reviews for specific base branches
reviews:
  # Auto review settings
  auto_review:
    enabled: true
    # Review PRs targeting these branches:
    # - Any branch → develop
    # - Any branch → main
    base_branches:
      - develop
      - main
  
  # Path filters
  path_filters:
    # Include all files by default
    - "**/*"
    # Exclude documentation. Not "!**/*.md": the LLM system prompts in
    # scripts/ai-generator/prompts/*.md ship with the module and are reviewed.
    - "!*.md"
    - "!docs/**"
    # Exclude the unit tests
    - "!test/**"

# Chat settings
chat:
  auto_reply: true
  art: true
