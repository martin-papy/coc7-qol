version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows/ current (SHA and version comment).
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  # Dev-only tooling (ESLint, jsdom); never shipped in the release zip.
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        dependency-type: development
