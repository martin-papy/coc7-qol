name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual run for a tag whose original run can no longer be re-run: pick the tag
  # under "Use workflow from". Every step is safe to repeat (see the release job).
  workflow_dispatch:

# Jobs ask for what they need; nothing is granted by default.
permissions: {}

# Two runs for one tag (a re-run next to a manual run) must not race on the release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Lint and unit tests gate the release: test.yml also runs on the push to main,
  # but in parallel with this workflow, so it could not stop a tag on its own.
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.parse.outputs.TAG }}
      module_id: ${{ steps.parse.outputs.MODULE_ID }}
      module_version: ${{ steps.parse.outputs.MODULE_VERSION }}
      compat_min: ${{ steps.parse.outputs.COMPAT_MIN }}
      compat_verified: ${{ steps.parse.outputs.COMPAT_VERIFIED }}
      compat_max: ${{ steps.parse.outputs.COMPAT_MAX }}
      is_stable: ${{ steps.parse.outputs.IS_STABLE }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and branches, so the preflight can check the tag is on main.
          fetch-depth: 0

      - name: Parse module.json and tag
        id: parse
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          VERSION_FROM_TAG="${TAG#v}"

          MODULE_ID=$(jq -r '.id'                          module.json)
          MODULE_VERSION=$(jq -r '.version'                module.json)
          MODULE_DOWNLOAD=$(jq -r '.download'              module.json)
          COMPAT_MIN=$(jq -r '.compatibility.minimum'      module.json)
          COMPAT_VERIFIED=$(jq -r '.compatibility.verified' module.json)
          COMPAT_MAX=$(jq -r '.compatibility.maximum // ""' module.json)

          IS_STABLE=false
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IS_STABLE=true
          fi

          {
            echo "TAG=$TAG"
            echo "VERSION_FROM_TAG=$VERSION_FROM_TAG"
            echo "MODULE_ID=$MODULE_ID"
            echo "MODULE_VERSION=$MODULE_VERSION"
            echo "MODULE_DOWNLOAD=$MODULE_DOWNLOAD"
            echo "COMPAT_MIN=$COMPAT_MIN"
            echo "COMPAT_VERIFIED=$COMPAT_VERIFIED"
            echo "COMPAT_MAX=$COMPAT_MAX"
            echo "IS_STABLE=$IS_STABLE"
          } | tee -a "$GITHUB_ENV" >> "$GITHUB_OUTPUT"

          echo "Parsed: tag=$TAG version=$MODULE_VERSION id=$MODULE_ID stable=$IS_STABLE"

      - name: Preflight assertions
        env:
          FOUNDRY_RELEASE_TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}
        run: |
          set -euo pipefail

          fail() { echo "::error::$1"; exit 1; }

          # 1. Tag format
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            fail "Tag '$TAG' does not match vX.Y.Z[-suffix]"
          fi

          # 2. Tag version matches module.json
          if [[ "$VERSION_FROM_TAG" != "$MODULE_VERSION" ]]; then
            fail "Tag version '$VERSION_FROM_TAG' does not match module.json .version '$MODULE_VERSION'"
          fi

          # 3. download URL points at this tag's zip
          EXPECTED_DOWNLOAD="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/coc7-qol.zip"
          if [[ "$MODULE_DOWNLOAD" != "$EXPECTED_DOWNLOAD" ]]; then
            fail "module.json .download is '$MODULE_DOWNLOAD' but expected '$EXPECTED_DOWNLOAD'"
          fi

          # 4. Required Foundry fields are non-empty
          [[ -n "$MODULE_ID"        ]] || fail "module.json .id is empty"
          [[ -n "$COMPAT_MIN"       ]] || fail "module.json .compatibility.minimum is empty"
          [[ -n "$COMPAT_VERIFIED"  ]] || fail "module.json .compatibility.verified is empty"

          # 5. A stable release is cut from main (release.sh tags on main). Pre-releases may come
          #    from any branch.
          if [[ "$IS_STABLE" == "true" ]] && ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            fail "Tag '$TAG' points at $GITHUB_SHA, which is not on main"
          fi

          # 6. A stable release is published to Foundry afterwards. Check the token is there
          #    before the GitHub release exists: once it does, "latest" already serves this
          #    version's manifest.
          if [[ "$IS_STABLE" == "true" && -z "${FOUNDRY_RELEASE_TOKEN:-}" ]]; then
            fail "FOUNDRY_RELEASE_TOKEN secret is not set"
          fi

          echo "Preflight OK: id=$MODULE_ID version=$MODULE_VERSION download=$MODULE_DOWNLOAD"

      - name: Build release zip
        run: |
          set -euo pipefail
          zip -r coc7-qol.zip module.json LICENSE scripts/ styles/ lang/
          echo "Zip contents:"
          unzip -l coc7-qol.zip

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PRERELEASE_FLAG="--prerelease"
          if [[ "$IS_STABLE" == "true" ]]; then
            PRERELEASE_FLAG="--latest"
          fi

          # Release notes: the curated CHANGELOG section for this version (release.sh requires
          # one for stable releases). A pre-release without a section falls back to GitHub's
          # generated notes.
          awk -v header="## [$MODULE_VERSION]" '
            index($0, header) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if grep -q '[^[:space:]]' release-notes.md; then
            NOTES_ARGS=(--notes-file release-notes.md)
          elif [[ "$IS_STABLE" == "true" ]]; then
            echo "::error::CHANGELOG.md has no '## [$MODULE_VERSION]' section"
            exit 1
          else
            NOTES_ARGS=(--generate-notes)
          fi

          # Repeatable: a second run for the same tag (re-run, manual run) finds the release
          # and replaces its two assets instead of failing on "release already exists".
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" coc7-qol.zip module.json --clobber
            echo "GitHub release already existed, assets replaced: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          else
            gh release create "$TAG" \
              coc7-qol.zip module.json \
              --title "$TAG" \
              "${NOTES_ARGS[@]}" \
              $PRERELEASE_FLAG
            echo "GitHub release created: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          fi

      - name: Job summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Release ${TAG:-$GITHUB_REF_NAME}"
            echo ""
            echo "- GitHub release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG:-$GITHUB_REF_NAME}"
            if [[ "${IS_STABLE:-false}" == "true" ]]; then
              echo "- Manifest: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/module.json"
              echo "- Compatibility: min ${COMPAT_MIN:-?} / verified ${COMPAT_VERIFIED:-?}"
              echo "- Foundry publish: see the foundry job"
            else
              echo "- Foundry publish: skipped (pre-release tag)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Its own job, so that a failed publish (expired token, 429, 5xx) is completed with
  # "Re-run failed jobs": the GitHub release is left alone and only this job runs again.
  foundry:
    needs: release
    if: ${{ needs.release.outputs.is_stable == 'true' }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release.outputs.tag }}
      MODULE_ID: ${{ needs.release.outputs.module_id }}
      MODULE_VERSION: ${{ needs.release.outputs.module_version }}
      COMPAT_MIN: ${{ needs.release.outputs.compat_min }}
      COMPAT_VERIFIED: ${{ needs.release.outputs.compat_verified }}
      COMPAT_MAX: ${{ needs.release.outputs.compat_max }}
    steps:
      - name: Foundry publish
        env:
          FOUNDRY_RELEASE_TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${FOUNDRY_RELEASE_TOKEN:-}" ]]; then
            echo "::error::FOUNDRY_RELEASE_TOKEN secret is not set"
            exit 1
          fi

          MANIFEST_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/module.json"
          NOTES_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

          # 1. Reachability: up to 3 attempts with 5s backoff
          for attempt in 1 2 3; do
            if curl -fsSL --connect-timeout 10 --max-time 30 --head -o /dev/null "$MANIFEST_URL"; then
              echo "Manifest reachable on attempt $attempt: $MANIFEST_URL"
              break
            fi
            if [[ $attempt -eq 3 ]]; then
              echo "::error::Manifest URL not reachable after 3 attempts: $MANIFEST_URL"
              exit 1
            fi
            echo "Manifest not reachable yet, retrying in 5s..."
            sleep 5
          done

          # 2. Build payload.json
          jq -n \
            --arg id        "$MODULE_ID" \
            --arg version   "$MODULE_VERSION" \
            --arg manifest  "$MANIFEST_URL" \
            --arg notes     "$NOTES_URL" \
            --arg minimum   "$COMPAT_MIN" \
            --arg verified  "$COMPAT_VERIFIED" \
            --arg maximum   "$COMPAT_MAX" \
            '{
              id: $id,
              "dry-run": true,
              release: ({
                version: $version,
                manifest: $manifest,
                notes: $notes,
                compatibility: ({
                  minimum: $minimum,
                  verified: $verified
                } + (if $maximum == "" then {} else {maximum: $maximum} end))
              })
            }' > payload.json

          echo "Dry-run payload:"
          cat payload.json

          # 3. Dry-run POST
          DRY_RESPONSE=$(curl -sS --connect-timeout 10 --max-time 60 -X POST https://foundryvtt.com/_api/packages/release_version/ \
            -H "Authorization: $FOUNDRY_RELEASE_TOKEN" \
            -H "Content-Type: application/json" \
            -d @payload.json)

          echo "Dry-run response: $DRY_RESPONSE"
          if [[ "$(echo "$DRY_RESPONSE" | jq -r '.status')" != "success" ]]; then
            echo "::error::Foundry dry-run failed: $DRY_RESPONSE"
            exit 1
          fi

          # 4. Real POST (strip dry-run field)
          jq 'del(."dry-run")' payload.json > payload-real.json

          REAL_RESPONSE=$(curl -sS --connect-timeout 10 --max-time 60 -X POST https://foundryvtt.com/_api/packages/release_version/ \
            -H "Authorization: $FOUNDRY_RELEASE_TOKEN" \
            -H "Content-Type: application/json" \
            -d @payload-real.json)

          echo "Real submit response: $REAL_RESPONSE"
          if [[ "$(echo "$REAL_RESPONSE" | jq -r '.status')" != "success" ]]; then
            echo "::error::Foundry real submit failed: $REAL_RESPONSE"
            exit 1
          fi

          FOUNDRY_PAGE=$(echo "$REAL_RESPONSE" | jq -r '.page')
          echo "FOUNDRY_PAGE=$FOUNDRY_PAGE" >> "$GITHUB_ENV"
          echo "Foundry publish succeeded: $FOUNDRY_PAGE"

      - name: Job summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Foundry publish ${TAG}"
            echo ""
            echo "- Foundry package page: ${FOUNDRY_PAGE:-not published}"
          } >> "$GITHUB_STEP_SUMMARY"
